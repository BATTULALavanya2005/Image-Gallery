<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <h1>Nature Gallery</h1>
        <div class="gallery">
            <img src="images/nature1.jpg" alt="Mountain landscape at sunrise">
            <img src="images/nature2.jpg" alt="Forest with sunlight streaming through trees">
            <img src="images/nature3.jpg" alt="Ocean waves crashing on rocks">
            <img src="images/nature4.jpg" alt="Field of wildflowers">
            <img src="images/nature5.jpg" alt="Snowy mountain peak">
            <img src="images/nature6.jpg" alt="Desert with sand dunes">
            <img src="images/nature1.jpg" alt="Mountain landscape at sunrise">
            <img src="images/nature2.jpg" alt="Forest with sunlight streaming through trees">
            <img src="images/nature3.jpg" alt="Ocean waves crashing on rocks">
            <img src="images/nature4.jpg" alt="Field of wildflowers">
            <img src="images/nature5.jpg" alt="Snowy mountain peak">
            <img src="images/nature6.jpg" alt="Desert with sand dunes">
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
        <a class="prev">&#10094;</a>
        <a class="next">&#10095;</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
